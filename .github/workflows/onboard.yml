# Turns an approved "Onboard an app" issue into pull requests.
#
#   label "preview"   renders the templates and posts the result on the issue
#                     (no access to other repos needed)
#   label "approved"  renders, then opens one PR in each of the app's repositories
#                     and one in platform-gitops, and links them on the issue
#
# An app lives in one repository (folders backend/ and frontend/) or in one repository
# per component (the code at each repository's root). The form says which; the app-repo
# template is rendered once per repository, the GitOps folder once for the app.
#
# Only people who can add labels (triage and above) can trigger it, and the
# PRs are reviewed like any other: nothing runs until they are merged.
#
# Writing to the other repos: a GitHub App ("goldenpath-bot") installed on
# the org's repos, with Contents and Pull requests read & write. The App ID is
# the repository variable ONBOARDING_APP_ID, its private key the secret
# ONBOARDING_APP_KEY; each run mints a token that lives for one hour and only
# for the repos it touches. Without the App, "approved" stops with a
# clear message; "preview" still works.
name: Onboard an app

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write # comments on the issue

concurrency:
  group: onboard-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  COPIER_VERSION: "9.18.1"

jobs:
  onboard:
    name: ${{ github.event.label.name }}
    if: github.event.label.name == 'preview' || github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    env:
      MODE: ${{ github.event.label.name }}
      ISSUE: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Copier
        run: pip install --quiet --disable-pip-version-check "copier==$COPIER_VERSION"

      # The form's answers, validated. An invalid form is reported on the issue.
      # answers.json holds the whole app (the GitOps render); repos/<name>.json one
      # file per app repository (the app-repo renders); repos/repos.json lists them.
      - name: Read the form
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s' "$ISSUE_BODY" > issue.md
          if ! python scripts/onboarding_answers.py issue.md --repos repos > answers.json 2> error.txt; then
            # shellcheck disable=SC2016 # backticks in the comment text are Markdown, not shell
            gh issue comment "$ISSUE" --body "$(printf ':x: The form has a problem, please edit it and add the label again:\n\n```\n%s\n```' "$(cat error.txt)")"
            gh issue edit "$ISSUE" --remove-label "$MODE"
            exit 1
          fi
          {
            jq -r 'to_entries[] | "\(.key)=\(.value)"' answers.json | grep -v '^owner='
            echo "repo_names=$(jq -r '[.[].name] | join(" ")' repos/repos.json)"
            echo "app_repo_names<<EOF"
            jq -r '.[].repository | split("/")[1]' repos/repos.json
            echo "EOF"
          } >> "$GITHUB_ENV"
          jq -r '.[] | "\(.name): \(.repository) (\(.layout))"' repos/repos.json

      # Each repository must match the answers (component folders or the root,
      # package.json, the chosen package manager's lockfile), or the first pipeline
      # run fails in three jobs. Repositories this token cannot read are checked
      # again with the App token.
      - name: Check the repositories against the answers
        run: |
          : > problems.txt
          for name in $repo_names; do
            repo=$(jq -r .repository "repos/$name.json")
            if ! gh api "repos/$repo" --silent 2>/dev/null; then
              echo "::notice::$repo is not readable with the workflow token; checked after the App token is minted"
              continue
            fi
            scripts/check-app-repo.sh "$repo" "repos/$name.json" >> problems.txt 2>&1 || echo "$repo" >> failed.txt
          done
          if [ -s failed.txt ]; then
            { printf ':x: The repositories do not match the form, please fix one or the other and add the label again:\n\n'; sed 's/^/- /' problems.txt; } > problem.md
            gh issue comment "$ISSUE" --body-file problem.md
            gh issue edit "$ISSUE" --remove-label "$MODE"
            exit 1
          fi

      # Rendered from this repo's latest release tag on GitHub (Copier's default
      # for a git template), not from the checkout: the rendered repo then
      # records `_src_path: gh:DEVOPS-CANARY/platform-golden-path` and `_commit: vX.Y.Z`,
      # which is what `copier update` needs to move it to a later release.
      - name: Render the templates
        env:
          TEMPLATE: gh:${{ github.repository }}
        run: |
          OUT="$RUNNER_TEMP/out"; echo "OUT=$OUT" >> "$GITHUB_ENV"
          mkdir -p "$OUT/gitops"
          for name in $repo_names; do
            mkdir -p "$OUT/$name"
            copier copy --defaults --trust --data-file "repos/$name.json" --data template=app-repo "$TEMPLATE" "$OUT/$name"
          done
          copier copy --defaults --trust --data-file answers.json --data template=gitops-app "$TEMPLATE" "$OUT/gitops"
          grep -hE '^(_src_path|_commit):' "$OUT/gitops/apps/$app/.golden-path.yml"
          (cd "$OUT" && find . -type f | sort | sed 's#^\./##') > "$GITHUB_WORKSPACE/files.txt"
          cat files.txt

      - name: Post the preview
        if: env.MODE == 'preview'
        run: |
          {
            echo "### Preview for \`$app\`"
            echo
            jq -r '.[] | "- `\(.name)`: \(.repository) (\(.layout) layout)"' repos/repos.json
            echo "- \`gitops\`: platform-gitops"
            echo
            echo "These files would be opened as pull requests when the **approved** label is added:"
            echo
            echo '```'; cat files.txt; echo '```'
            while read -r f; do
              echo "<details><summary><code>$f</code></summary>"; echo; echo '```'; cat "$OUT/$f"; echo '```'; echo "</details>"
            done < files.txt
          } > preview.md
          gh issue comment "$ISSUE" --body-file preview.md
          gh issue edit "$ISSUE" --remove-label preview

      - name: Check the App is configured
        if: env.MODE == 'approved' && vars.ONBOARDING_APP_ID == ''
        run: |
          gh issue comment "$ISSUE" --body ":x: The onboarding GitHub App is not configured on this repository (variable \`ONBOARDING_APP_ID\`, secret \`ONBOARDING_APP_KEY\`, see README), so the pull requests cannot be opened."
          gh issue edit "$ISSUE" --remove-label approved
          exit 1

      # A token for this run only: one hour, the app's repositories and platform-gitops.
      - name: Mint an App token
        if: env.MODE == 'approved'
        id: app-token
        continue-on-error: true # explained on the issue by the next step
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.ONBOARDING_APP_ID }}
          private-key: ${{ secrets.ONBOARDING_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ env.app_repo_names }}
            platform-gitops

      # The usual cause: the App is not installed on one of the app's repositories.
      - name: Explain a token failure
        if: env.MODE == 'approved' && steps.app-token.outcome != 'success'
        run: |
          gh issue comment "$ISSUE" --body "$(printf ':x: Could not get a token for the app repositories (%s) and **platform-gitops**. Usually the GitHub App is not installed on one of them: in the org settings, GitHub Apps, *goldenpath-bot*, *Configure*, choose **All repositories** (or add the repository), then add the **approved** label again.' "$(jq -r '[.[].repository] | join(", ")' repos/repos.json)")"
          gh issue edit "$ISSUE" --remove-label approved
          exit 1

      - name: Check private repositories against the answers
        if: env.MODE == 'approved'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          : > problems.txt; rm -f failed.txt
          for name in $repo_names; do
            repo=$(jq -r .repository "repos/$name.json")
            scripts/check-app-repo.sh "$repo" "repos/$name.json" >> problems.txt 2>&1 || echo "$repo" >> failed.txt
          done
          if [ -s failed.txt ]; then
            export GH_TOKEN="${{ secrets.GITHUB_TOKEN }}"
            { printf ':x: The repositories do not match the form, please fix one or the other and add the label again:\n\n'; sed 's/^/- /' problems.txt; } > problem.md
            gh issue comment "$ISSUE" --body-file problem.md
            gh issue edit "$ISSUE" --remove-label approved
            exit 1
          fi

      # The branches the pipeline expects: develop (UAT), staging, main (releases).
      # Missing ones are created from the default branch; existing ones are kept.
      - name: Create the branches
        if: env.MODE == 'approved'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          for name in $repo_names; do
            repo=$(jq -r .repository "repos/$name.json")
            default=$(gh api "repos/$repo" --jq .default_branch)
            sha=$(gh api "repos/$repo/git/ref/heads/$default" --jq .object.sha)
            created=""
            for branch in develop staging main; do
              if gh api "repos/$repo/git/ref/heads/$branch" --silent 2>/dev/null; then continue; fi
              gh api -X POST "repos/$repo/git/refs" -f ref="refs/heads/$branch" -f sha="$sha" --silent
              created="$created $branch"
            done
            created=${created# }
            echo "${created:-none, all existed}" > "branches-$name.txt"
            echo "$repo: branches created from $default: ${created:-none, all existed}"
          done

      # Environments need Administration: write, which the onboarding App does
      # not have on purpose. An optional second App holding only that permission
      # (variable ONBOARDING_ADMIN_APP_ID, secret ONBOARDING_ADMIN_APP_KEY) creates
      # them with a one-hour token scoped to the app's repositories. Without it, the
      # app PR tells a repository admin which script to run.
      - name: Mint an admin token (optional)
        if: env.MODE == 'approved' && vars.ONBOARDING_ADMIN_APP_ID != ''
        id: admin-token
        continue-on-error: true # the PR then carries the manual step
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.ONBOARDING_ADMIN_APP_ID }}
          private-key: ${{ secrets.ONBOARDING_ADMIN_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.app_repo_names }}

      - name: Create the environments
        if: env.MODE == 'approved'
        env:
          ADMIN_TOKEN: ${{ steps.admin-token.outputs.token }}
        run: |
          owner=$(jq -r .owner answers.json)
          for name in $repo_names; do
            repo=$(jq -r .repository "repos/$name.json")
            if [ -n "$ADMIN_TOKEN" ]; then
              GH_TOKEN="$ADMIN_TOKEN" scripts/repo-environments.sh "$repo" "$owner"
              # shellcheck disable=SC2016 # backticks are Markdown
              printf -- '- [x] GitHub Environments `uat` (develop), `staging` (staging, hotfix/*), `production` (main, tags v*; reviewer %s): created by the golden path\n' "$owner" > "environments-$name.md"
            else
              # shellcheck disable=SC2016 # backticks are Markdown
              printf -- '- [ ] GitHub Environments `uat`, `staging`, `production`: a repository admin runs `scripts/repo-environments.sh %s %s` from a golden-path checkout (no admin App is configured, see README)\n' "$repo" "$owner" > "environments-$name.md"
            fi
          done

      # One PR per repository, on branch onboard/golden-path. Files are copied
      # over the checkout, so re-running updates the same branch.
      - name: Open the pull requests
        if: env.MODE == 'approved'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GITOPS_REPO: ${{ github.repository_owner }}/platform-gitops
        run: |
          # Commits are authored by the App's bot user, so history shows what was automated.
          # The app PR's title is also its commit message, which the pipeline's
          # Conventional Commits gate checks: it must be `ci: ...`.
          bot_id=$(GH_TOKEN="$APP_TOKEN" gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config --global user.name "${APP_SLUG}[bot]"
          git config --global user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          # git pushes and `gh pr create` on the target repos use the App token.
          export GH_TOKEN="$APP_TOKEN"
          gh auth setup-git
          # Writes the PR URL to <out-file>. Any failure (clone, push, PR) ends
          # the step, and the error is reported on the issue by the next step.
          open_pr() { # <repo> <rendered-dir> <base-branch-preference> <title> <body-file> <out-file>
            local repo=$1 src=$2 prefer=$3 title=$4 body=$5 out=$6 dir base url
            dir=$(mktemp -d)
            git clone --quiet "https://github.com/$repo.git" "$dir"
            if git -C "$dir" branch -r | grep -qE "origin/$prefer$"; then base=$prefer; else base=$(git -C "$dir" rev-parse --abbrev-ref HEAD); fi
            git -C "$dir" checkout --quiet "$base"
            git -C "$dir" checkout --quiet -B onboard/golden-path
            cp -R "$src"/. "$dir"/
            git -C "$dir" add -A
            if git -C "$dir" diff --cached --quiet; then echo "$repo: already up to date" > "$out"; return 0; fi
            git -C "$dir" commit --quiet -m "$title" -m "Rendered by the golden path from $GITHUB_SERVER_URL/$GH_REPO/issues/$ISSUE"
            git -C "$dir" push --quiet --force-with-lease origin onboard/golden-path
            url=$(gh pr list --repo "$repo" --head onboard/golden-path --json url --jq '.[0].url')
            [ -n "$url" ] || url=$(gh pr create --repo "$repo" --base "$base" --head onboard/golden-path --title "$title" --body-file "$body")
            echo "$url" > "$out"
          }
          : > prs.md
          for name in $repo_names; do
            repo=$(jq -r .repository "repos/$name.json")
            what=$(jq -r '[(if .backend != "not-needed" then "backend" else empty end), (if .frontend != "not-needed" then "frontend" else empty end)] as $c
              | if .layout == "root" then "the \($c | join(" and ")) of **\(.app)** (code at the root of this repository)" else "**\(.app)**" end' "repos/$name.json")
            cat > "app-pr-$name.md" <<EOF
          Opened by the golden path from $GITHUB_SERVER_URL/$GH_REPO/issues/$ISSUE.

          Adds the shared pipeline caller and the Dockerfiles for $what. Before merging:
          - [x] Branches \`develop\`, \`staging\`, \`main\` exist (created by the golden path: $(cat "branches-$name.txt")); hotfixes go on \`hotfix/<name>\`
          $(cat "environments-$name.md")
          - [ ] Commit messages follow Conventional Commits (feat:, fix:, ...): they decide the version numbers
          - [ ] Each component has the scripts the pipeline runs: \`format:check lint typecheck test build\`
          - [ ] The GitOps PR is merged first (the first deploy needs the environment to exist)

          Every PR here then runs the gates; a merge to \`develop\` deploys to UAT.
          EOF
            open_pr "$repo" "$OUT/$name" develop "ci: add the golden path pipeline and Dockerfiles for $app" "app-pr-$name.md" "app-pr-$name.url" 2>&1 | tee -a push.log
            echo "- $repo: $(cat "app-pr-$name.url")" >> prs.md
          done
          cat > gitops-pr.md <<EOF
          Opened by the golden path from $GITHUB_SERVER_URL/$GH_REPO/issues/$ISSUE.

          Adds \`apps/$app\` with its UAT environment (rssb-app chart). Image digests are placeholders
          until the app's first deploy from \`develop\` writes the real ones. Before merging:
          - [ ] Seal the secrets listed in \`apps/$app/envs/uat/secrets/README.md\` (one sealed file per cluster)
          - [ ] Redis, if used: build cluster \`CLUSTER=rssb-build scripts/seal-build-services.sh $app-uat\`; lab: \`$(echo "$app" | tr 'a-z-' 'A-Z_')_UAT_REDIS_PASSWORD\` in platform-secrets and \`scripts/lab-services.sh\`
          - [ ] Review the shared values (ports, routes, env) with the app's developers

          Once merged, Argo CD creates namespace \`$app-uat\` (walled by policy) and waits for the first image.
          EOF
          open_pr "$GITOPS_REPO" "$OUT/gitops" main "Onboard $app: UAT environment" gitops-pr.md gitops-pr.url 2>&1 | tee -a push.log
          echo "- platform-gitops: $(cat gitops-pr.url)" >> prs.md
          export GH_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          # shellcheck disable=SC2016 # backticks in the comment text are Markdown, not shell
          gh issue comment "$ISSUE" --body "$(printf ':rocket: Pull requests opened for `%s`:\n%s\n\nMerge the GitOps one first, then the app ones.' "$app" "$(cat prs.md)")"
          gh issue edit "$ISSUE" --remove-label approved --add-label "prs-opened"

      - name: Report a failure on the issue
        if: failure() && env.MODE == 'approved' && steps.app-token.outcome == 'success'
        run: |
          # shellcheck disable=SC2016 # backticks in the comment text are Markdown, not shell
          gh issue comment "$ISSUE" --body "$(printf ':x: Opening the pull requests failed. Fix the cause and add the **approved** label again. Last lines:\n\n```\n%s\n```\n\nA push refused for `.github/workflows/...` means the App lacks the **Workflows: read & write** permission.' "$(tail -n 15 push.log 2>/dev/null || echo 'no log')")"
          gh issue edit "$ISSUE" --remove-label approved
